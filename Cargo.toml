[workspace]
resolver = "3"
members = [
    "crates/rsrewind-core",
    "crates/rsrewind-capture",
    "crates/rsrewind-segment",
    "crates/rsrewind-storage",
    "crates/rsrewind-ocr",
    "crates/rsrewind-query",
    "crates/rsrewind-daemon",
    "crates/rsrewind-cli",
    "crates/rsrewind-ui",
    "crates/rsrewind-tray",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/spilloid/rsRewind"
publish = false

[workspace.dependencies]
rsrewind-core = { path = "crates/rsrewind-core" }
rsrewind-capture = { path = "crates/rsrewind-capture" }
rsrewind-segment = { path = "crates/rsrewind-segment" }
rsrewind-storage = { path = "crates/rsrewind-storage" }
rsrewind-ocr = { path = "crates/rsrewind-ocr" }
rsrewind-query = { path = "crates/rsrewind-query" }
rsrewind-daemon = { path = "crates/rsrewind-daemon" }
rsrewind-ui = { path = "crates/rsrewind-ui" }
rsrewind-tray = { path = "crates/rsrewind-tray" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
webp = "0.3"
tempfile = "3"
# Glyph rasterizing for the synthetic-history example only (never shipped code).
ab_glyph = "0.2"
sha2 = "0.10"
getrandom = "0.3"
# Recorder crates use the `windows` 0.62 projection. The UI crate uses no Windows bindings of its
# own (Iced + wgpu); no Windows type crosses the UI boundary (see ARCHITECTURE.md).
windows = "0.62"
# The desktop UI (rsrewind-ui only). Default features off: the UI picks wgpu and no image codecs
# (frames arrive decoded from rsrewind-query).
iced = { version = "0.14.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
