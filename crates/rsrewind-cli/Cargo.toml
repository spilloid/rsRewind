[package]
name = "rsrewind-cli"
description = "rsrewind.exe: recorder, search and diagnostics command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rsrewind"
path = "src/main.rs"

[dependencies]
rsrewind-core.workspace = true
rsrewind-storage.workspace = true
rsrewind-query.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(windows)'.dependencies]
rsrewind-daemon.workspace = true
rsrewind-capture.workspace = true
rsrewind-ocr.workspace = true
rsrewind-ui.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[lints]
workspace = true
