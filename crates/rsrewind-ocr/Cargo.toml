[package]
name = "rsrewind-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rsrewind-core.workspace = true
thiserror.workspace = true

# Linux: ocrs (pure Rust; models run by rten). Models are read from the data folder, never downloaded.
[target.'cfg(target_os = "linux")'.dependencies]
ocrs = "0.13"
rten = "0.26"

[target.'cfg(target_os = "linux")'.dev-dependencies]
webp.workspace = true

# Windows.Media.Ocr.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Graphics_Gdi",
] }

[lints]
workspace = true
