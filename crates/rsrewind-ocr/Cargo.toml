[package]
name = "rsrewind-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rsrewind-core.workspace = true
thiserror.workspace = true

# Linux: the system's Tesseract, run as a child process (nothing linked, nothing downloaded); the frame
# is handed over as a PNG.
[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18"

[target.'cfg(target_os = "linux")'.dev-dependencies]
webp.workspace = true

# Windows.Media.Ocr.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Graphics_Gdi",
] }

[lints]
workspace = true
