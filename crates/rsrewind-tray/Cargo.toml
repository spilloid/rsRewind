[package]
name = "rsrewind-tray"
description = "rsRewind's notification-area icon: state at a glance, pause, forget, open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Like the UI, the tray never reaches capture, storage, OCR or the daemon: it acts only through the
# `rsrewind` command line.
[dependencies]
rsrewind-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Decodes the embedded tray artwork (pure Rust).
png = "0.18"

# StatusNotifierItem over the session bus; pure Rust (zbus), no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Notification-area icon, popup menu and the icon bitmaps.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
