[package]
name = "rsrewind-daemon"
description = "rsRewind recorder: capture -> change detection -> storage -> OCR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rsrewind-core.workspace = true
rsrewind-storage.workspace = true
# Portable parts only off Windows: change detection and the window/rect shapes.
rsrewind-capture.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = "0.3"
rsrewind-ocr.workspace = true

[target.'cfg(windows)'.dependencies]
rsrewind-ocr.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[dev-dependencies]
rsrewind-query.workspace = true
rsrewind-segment.workspace = true
tempfile.workspace = true

[lints]
workspace = true
