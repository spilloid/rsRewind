# License gate (docs/licensing.md). `cargo deny check licenses` runs in CI on every pull request.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "Unicode-3.0",
]

[licenses.private]
# rsRewind's own crates (publish = false) are MIT via the workspace.
ignore = true
